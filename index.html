<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Encuesta sobre la inteligencia artificial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDFCF8; --ink:#212338; --amber:#FCB034; --track:#F9F8F4; --pill:#FEFDFB;
  --line:#E4E4E0; --mute:#98979C; --green:#18CA80; --rowtxt:#939499; --circle:#FEEEEE;
  --flame:#F2562D; --mint:#F0FCF8; --mint2:#D8F4F0; --err:#D9453D; --backdrop:#6667F5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center}
.phone{width:100%;height:100%;max-width:430px;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:560px){html,body{background:var(--backdrop)}.phone{height:min(100%,860px);max-width:390px}}
.screen{height:100%;display:flex;flex-direction:column;padding:0 22px}
.top{display:flex;align-items:center;gap:25px;padding-top:max(12px,calc(42px - env(safe-area-inset-top,0px)));flex:none}
.back,.close{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--pill);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.track{flex:1;height:7px;background:var(--track);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .35s ease}
h1{margin:22px 0 0;font-weight:500;font-size:25px;line-height:28px;letter-spacing:-.01em;flex:none}
.sub{margin:8px 0 0;font-size:15px;line-height:20px;flex:none}
.list{flex:1;min-height:0;overflow-y:auto;margin:12px -22px 0;padding:0 22px;display:flex;flex-direction:column;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.opts{margin-top:auto;display:flex;flex-direction:column;gap:9px;padding:2px 0}
.pill{position:relative;flex:none;height:67px;padding:0 48px;border:2px solid var(--line);background:var(--pill);border-radius:99px;font:300 16px "Outfit",system-ui,sans-serif;color:var(--mute);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,color .15s}
.pill.sel{border-color:var(--amber);color:var(--ink);font-weight:600}
.chk{position:absolute;right:22px;top:50%;width:18px;height:18px;margin-top:-9px;opacity:0}
.sel .chk{opacity:1}
.err{margin:0;min-height:17px;padding-top:0;font-size:13.5px;line-height:17px;color:var(--err);text-align:center;flex:none}
.next{flex:none;width:100%;height:44px;margin-bottom:16px;border:0;border-radius:99px;background:var(--green);color:#fff;font:500 16px "Outfit",system-ui,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.next.idle{opacity:.5}
.next:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* pantalla final */
.hero{flex:none;margin:0 -22px}
.hero svg{display:block;width:100%;height:auto}
.close{position:absolute;top:max(12px,calc(42px - env(safe-area-inset-top,0px)));right:22px;z-index:2}
.done h1{margin-top:26px}
.rows{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:18px}
.rows li{display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:21px;color:var(--rowtxt)}
.ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--circle);display:grid;place-items:center}
.ic svg{width:18px;height:18px;fill:var(--flame)}
.spacer{flex:1}
.link{align-self:center;background:none;border:0;padding:6px;margin:0 0 6px;font:400 13px "Outfit",system-ui,sans-serif;color:var(--rowtxt);text-decoration:underline;cursor:pointer}
.sum{display:none;margin:0 0 8px;padding:10px;background:var(--track);border-radius:12px;font-size:12px;line-height:1.5;color:var(--ink);white-space:pre-wrap}
.sum.on{display:block}
/* efectos de la pantalla final: confeti y vela */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.confetti i{position:absolute;top:-24px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),130vh) rotate(720deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1.5deg)}25%{transform:scale(.94,1.07) rotate(2deg)}50%{transform:scale(1.05,.95) rotate(-2deg)}75%{transform:scale(.96,1.04) rotate(1deg)}}
@keyframes glow{0%,100%{opacity:.18}50%{opacity:.34}}
@media(prefers-reduced-motion:reduce){.flame,.glow{animation:none}.confetti{display:none}}
</style>
</head>
<body>
<main class="phone" id="app"></main>
<script>
var STEPS=[
 {k:"alias",t:"Elige tu alias",s:"Elige una opción",o:["Búho","Zorro","Delfín","Lince","Halcón","Panda","Lobo","Tigre"],req:true,m:"Elige un alias para continuar."},
 {k:"edad",t:"¿Cuántos años tienes?",s:"Elige una opción",o:["11","12","13","14","15","16","17","18","19"],req:true,m:"Elige tu edad para continuar."},
 {k:"genero",t:"¿Con qué género te identificas?",s:"Opcional. Puedes dejarlo sin responder.",o:["Femenino","Masculino","Prefiero no decirlo"],req:false},
 {k:"grado",t:"¿En qué grado estás?",s:"Elige una opción",o:["7.º","8.º","9.º","10.º","11.º","12.º"],req:true,m:"Elige tu grado para continuar."},
 {k:"interes",t:"¿Qué te interesa más de la inteligencia artificial?",s:"Elige una opción",o:["Sus beneficios","Sus riesgos"],req:true,m:"Elige una opción para continuar."},
 {k:"opinion",t:"¿Estás a favor del uso de la inteligencia artificial en la sociedad?",s:"Elige una opción",o:["Sí","No"],req:true,m:"Elige Sí o No para enviar."}
];
var app=document.getElementById("app");
var step=0, done=false, submitted=false, lock=false, answers={}, payload=null, shown=0;
var CHECK='<svg class="chk" viewBox="0 0 18 18" fill="none" stroke="#FCB034" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5l4.2 4.2L15.5 4.5"/></svg>';
var BACK='<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#212338" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2L4 7l5 5"/></svg>';
var X='<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#212338" stroke-width="2" stroke-linecap="round"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9"/></svg>';
var ART='<svg viewBox="0 0 390 290" role="img" aria-label="Ilustración de dos estudiantes sonriendo"><defs><clipPath id="cp"><path d="M0 0H390V240Q195 296 0 240Z"/></clipPath></defs><path d="M0 0H390V240Q195 296 0 240Z" fill="#F0FCF8"/><g clip-path="url(#cp)"><path d="M0 30C70 10 100 90 45 140S0 210 0 210Z" fill="#D8F4F0"/><circle cx="345" cy="35" r="62" fill="#D8F4F0"/><path d="M26 290C34 205 76 176 122 176C168 176 196 208 202 290Z" fill="#2ECC8F"/><path d="M186 290C190 214 220 182 262 182C306 182 338 214 344 290Z" fill="#FF6A3D"/><circle cx="118" cy="104" r="44" fill="#4A2A18"/><circle cx="118" cy="118" r="34" fill="#8A4B2E"/><path d="M82 100Q118 80 154 100" stroke="#FCB034" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M103 118q5-5 10 0M125 118q5-5 10 0M108 134q10 8 20 0" stroke="#2A160C" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="302" cy="92" r="15" fill="#1F2A55"/><circle cx="262" cy="128" r="33" fill="#FBD3C0"/><path d="M228 124C224 86 256 74 288 88C304 96 300 124 296 138C292 112 272 102 248 106C238 109 232 116 228 124Z" fill="#1F2A55"/><circle cx="250" cy="130" r="11" fill="#fff" fill-opacity=".6" stroke="#1F2A55" stroke-width="2.5"/><circle cx="276" cy="130" r="11" fill="#fff" fill-opacity=".6" stroke="#1F2A55" stroke-width="2.5"/><path d="M250 148q12 9 26 0" stroke="#7A3B2A" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M150 232Q214 226 250 202" stroke="#8A4B2E" stroke-width="22" fill="none" stroke-linecap="round"/></g><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCB034"/><stop offset="1" stop-color="#F2562D"/></linearGradient></defs><g transform="translate(34 62)" aria-label="Vela encendida"><circle class="glow" cx="0" cy="12" r="22" fill="#FCB034"/><rect x="-9" y="28" width="18" height="50" rx="3" fill="#FFE9C7" stroke="#F3CE9A" stroke-width="1.5"/><path d="M-9 40q4 8 8 0t8 3v-9h-16z" fill="#FFF6E6"/><rect x="-17" y="76" width="34" height="7" rx="3.500" fill="#FCB034"/><path d="M0 28v-8" stroke="#212338" stroke-width="2" stroke-linecap="round"/><g class="flame"><path d="M0 -4C8 5 9 14 0 21C-9 14 -8 5 0 -4Z" fill="url(#fl)"/><path d="M0 7C4 11 4 15 0 19C-4 15 -4 11 0 7Z" fill="#FFF1B8"/></g></g></svg>';
var FLAME='<svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-2.200 1-3.500 2.500-4.500 0 2 .8 3 2 3.200C9.500 8 10.500 5 12 2z"/></svg>';
var PERSON='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.500"/><path d="M3.500 21c0-4.700 3.800-7 8.500-7s8.500 2.300 8.500 7z"/></svg>';
var SHIELD='<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6.500c0 5-3.400 8.800-8 10.500-4.600-1.700-8-5.500-8-10.500V5z"/></svg>';

function render(){ if(done){renderDone();return;} var s=STEPS[step], last=step===STEPS.length-1;
  var pills=s.o.map(function(v){var on=answers[s.k]===v;
    return '<button type="button" class="pill'+(on?' sel':'')+'" role="radio" aria-checked="'+on+'" data-v="'+v+'">'+v+CHECK+'</button>';}).join("");
  app.innerHTML='<section class="screen">'+
   '<header class="top"><button type="button" class="back" id="back" aria-label="Regresar"'+(step===0?' style="opacity:.4;cursor:default" aria-disabled="true" tabindex="-1"':'')+'>'+BACK+'</button>'+
   '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="'+STEPS.length+'" aria-valuenow="'+(step+1)+'"><i id="fill" style="width:'+(shown/STEPS.length*100)+'%"></i></div></header>'+
   '<h1>'+s.t+'</h1><p class="sub">'+s.s+'</p>'+
   '<div class="list"><div class="opts" id="opts" role="radiogroup" aria-label="'+s.t+'">'+pills+'</div></div>'+
   '<p class="err" id="err" role="alert"></p>'+
   '<button type="button" class="next'+(s.req&&!answers[s.k]?' idle':'')+'" id="next">'+(last?'Enviar':'Siguiente')+'</button></section>';
  var f=document.getElementById("fill");
  requestAnimationFrame(function(){requestAnimationFrame(function(){f.style.width=((step+1)/STEPS.length*100)+"%";shown=step+1;});});
}
function renderDone(){
  app.innerHTML='<section class="screen done"><div class="hero">'+ART+'</div>'+
   '<button type="button" class="close" id="again-x" aria-label="Cerrar">'+X+'</button>'+
   '<h1>¡Gracias por participar, '+answers.alias+'!</h1>'+
   '<ul class="rows"><li><span class="ic">'+FLAME+'</span><span>Tu respuesta se guardó correctamente.</span></li>'+
   '<li><span class="ic">'+PERSON+'</span><span>No pedimos tu nombre real ni datos de contacto.</span></li>'+
   '<li><span class="ic">'+SHIELD+'</span><span>Pronto podrás ver los resultados en el dashboard.</span></li></ul>'+
   '<div class="spacer"></div><pre class="sum" id="sum"></pre>'+
   '<button type="button" class="link" id="seesum">Ver mis respuestas (solo para pruebas)</button>'+
   '<button type="button" class="next" id="again">Empezar de nuevo</button></section>';
  document.getElementById("sum").textContent=JSON.stringify(payload,null,2);
  burst();
}
function burst(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box=document.createElement("div"); box.className="confetti"; box.setAttribute("aria-hidden","true");
  var cols=["#18CA80","#FCB034","#F2562D","#6667F5","#212338"];
  for(var i=0;i<44;i++){var c=document.createElement("i");
    c.style.left=(Math.random()*100)+"%"; c.style.background=cols[i%cols.length]; c.style.borderRadius=(i%3===0)?"50%":"2px";
    c.style.width=(6+Math.random()*6)+"px"; c.style.height=(8+Math.random()*8)+"px";
    c.style.animationDuration=(2.4+Math.random()*1.8)+"s"; c.style.animationDelay=(Math.random()*.7)+"s";
    c.style.setProperty("--dx",(Math.random()*80-40)+"px"); box.appendChild(c);}
  app.appendChild(box); setTimeout(function(){if(box.parentNode) box.parentNode.removeChild(box);},5200);
}
function reset(){answers={};step=0;done=false;submitted=false;payload=null;shown=0;render();}
/* ===== CONFIGURACIÓN: solo la dirección del proyecto y la clave PÚBLICA (publishable). Nunca pongas aquí una clave secret. ===== */
var SUPABASE_URL="https://dlkariaqmzzmsdvghfsl.supabase.co";
var SUPABASE_KEY="sb_publishable_LoYMFrUtsCf_E8SSap1ayg_2QPLLH6y";
var sending=false;
function showErr(m){var e=document.getElementById("err"); if(e) e.textContent=m;}
function setSending(on){sending=on; var nx=document.getElementById("next"); if(nx){nx.disabled=on; nx.textContent=on?"Enviando…":"Enviar";}}
function submit(){
  if(sending||submitted) return;                 /* protección contra doble clic */
  var row={alias:answers.alias,edad:Number(answers.edad),genero:answers.genero||"Prefiero no decirlo",grado:answers.grado,interes:answers.interes,opinion:answers.opinion};
  setSending(true); showErr("");
  var ctl=new AbortController(); var to=setTimeout(function(){ctl.abort();},15000);
  fetch(SUPABASE_URL+"/rest/v1/respuestas",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Prefer":"return=minimal"},body:JSON.stringify(row),signal:ctl.signal})
  .then(function(r){
    clearTimeout(to);
    if(r.ok){submitted=true; payload=row; sending=false; done=true; render();}   /* éxito SOLO si el servidor respondió bien */
    else{setSending(false); showErr(r.status>=400&&r.status<500?"El servidor no aceptó tus respuestas. Revisa los datos e inténtalo de nuevo.":"No se pudo guardar tu respuesta. Inténtalo de nuevo en un momento.");}
  })
  .catch(function(){clearTimeout(to); setSending(false); showErr("No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.");});
}
app.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t) return; var s=STEPS[step];
  if(t.classList.contains("pill")){
    var v=t.getAttribute("data-v");
    if(answers[s.k]===v && !s.req) delete answers[s.k]; else answers[s.k]=v;
    var all=document.querySelectorAll(".pill");
    for(var i=0;i<all.length;i++){var on=all[i].getAttribute("data-v")===answers[s.k];all[i].classList.toggle("sel",on);all[i].setAttribute("aria-checked",on);}
    document.getElementById("err").textContent=""; document.getElementById("next").classList.remove("idle"); return;
  }
  if(t.id==="back"){ if(!lock&&!sending&&step>0){step--;shown=step+1;render();} return; }
  if(t.id==="next"){
    if(lock||submitted||sending) return;
    if(s.req&&!answers[s.k]){
      document.getElementById("err").textContent=s.m;
      var o=document.getElementById("opts"); o.classList.remove("shake"); void o.offsetWidth; o.classList.add("shake"); return;
    }
    lock=true; setTimeout(function(){lock=false;},400);   /* evita saltar pantallas con doble toque */
    if(step===STEPS.length-1) submit(); else {step++;render();}
    return;
  }
  if(t.id==="seesum"){document.getElementById("sum").classList.toggle("on");return;}
  if(t.id==="again"||t.id==="again-x"){reset();}
});
render();
</script>
</body>
</html>
